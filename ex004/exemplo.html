<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Valores</title>
    <style>
        *{
            font-size: 20pt;
        }
        #telefone{
            
            background: url(Capturar.PNG);
            background-repeat: no-repeat;
            background-size: contain;
            padding-top: 93px;
            padding-right: 10px;
            width: 500px;
            height: 1200px;
            border-radius: 100px;
        }
        div{
            background-color: rgb(185, 32, 32);
            text-align: center;
            width: 437px;
            height: 520px;
            line-height: 80px;
            margin: auto;
        }
        input{
            width: 100px;
            height: 50px;
            font-size: 20pt;
        }
        #botao{
            width: 60px;
            font-size: 12pt;
        }
    </style>
</head>
<body>
  <div id="telefone">
      
       <div>
            <h1>Somando Valores</h1>
           <input type="number" name="txn1" id="txn1"> + <br>
           <input type="number" name="txn2" id="txn2">
           <input type="button" onclick="somar()" value="Somar" id="botao">
           <div id="res">
               Resultado:
       </div>
  </div>
    </div>
    <script>
        function somar(){
        var tn1 = window.document.getElementById('txn1')
        var tn2 = window.document.getElementById('txn2')
        var  res = window.document.getElementById('res')
        var n1 = Number(tn1.value)
        var n2 = Number(tn2.value)
        var resultado = n1 + n2
        res.innerHTML = `Este é o seu resultado: ${resultado}`
        }
    </script>
</body>
</html>
