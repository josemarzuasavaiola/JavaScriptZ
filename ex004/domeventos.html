<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div{
            background-color: green;
            color: white;
            text-align: center;
            height: 200px;
            width: 200px;
            line-height: 200px;
        }
    </style>
</head>
<body>
    <div id="area" onmouseenter="entrou()" onmouseout="saiu()" onclick="clicar()">
        Clica em mim 
    </div>

    <script>
        function clicar() {
            var a = window.document.getElementById('area')
            a.innerText = 'Clicou'
            a.style. backgroundColor = 'red'
        }
        function entrou() {
            var a = window.document.getElementById('area')
            a.innerText = 'Entrou'
            a.style.backgroundColor = 'Blue'
        }
        function saiu(){
            var a = window.document.getElementById('area')
            a.innerText = 'Saiu'
            a.style.backgroundColor = 'green'
        }
    </script>
</body>
</html>
