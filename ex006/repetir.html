<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetições</title>
</head>
<body>
    <h1 onclick="contador()">Vamos</h1>
    <script>
        function contador(){
            var num = 1
            var resul = document.getElementsByTagName('h1')[0]
            while (num <=100){
             
                resul.innerHTML =  num
                
            }
        }
    </script>
</body>
