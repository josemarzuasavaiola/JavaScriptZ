<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body{
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <h1>Aprendendo DOM</h1>
    <p>Será difícil</p>
    <p>Mas é o melhor a ser feito</p>

    <div id="botao">Click em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[0]
        var d = window.document.getElementById('botao')
        d.style.color = 'Blue'
        corpo.style.backgroundColor = 'Orange'
        p1.style.backgroundColor = 'blue'
        
    </script>
</body>
</html>
